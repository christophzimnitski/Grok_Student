<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007aff" />
    <title>Grok Student</title>

    <style>
        :root {
            --bg: #f5f5f7;
            --text: #000;
            --user-bg: #007aff;
            --user-text: white;
            --grok-bg: #e5e5ea;
            --grok-text: black;
            --input-bg: white;
            --border: #ddd;
            --code-bg: #f6f8fa;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --text: #fff;
                --user-bg: #0a84ff;
                --user-text: white;
                --grok-bg: #3a3a3c;
                --grok-text: #e5e5ea;
                --input-bg: #2c2c2e;
                --border: #444;
                --code-bg: #2d2d2f;
            }
        }

        [data-theme="dark"] {
            --bg: #1c1c1e !important;
            --text: #fff !important;
            --user-bg: #0a84ff !important;
            --user-text: white !important;
            --grok-bg: #3a3a3c !important;
            --grok-text: #e5e5ea !important;
            --input-bg: #2c2c2e !important;
            --border: #444 !important;
            --code-bg: #2d2d2f !important;
        }

        [data-theme="light"] {
            --bg: #f5f5f7 !important;
            --text: #000 !important;
            --user-bg: #007aff !important;
            --user-text: white !important;
            --grok-bg: #e5e5ea !important;
            --grok-text: black !important;
            --input-bg: white !important;
            --border: #ddd !important;
            --code-bg: #f6f8fa !important;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.4;
            font-size: 16px;
            word-wrap: break-word;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }

        .message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .user {
            align-self: flex-end;
            background: var(--user-bg);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
        }

        .grok {
            align-self: flex-start;
            background: var(--grok-bg);
            color: var(--grok-text);
            border-bottom-left-radius: 4px;
        }

        #input-container {
            padding: 12px 16px;
            background: var(--input-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #prompt {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 16px;
            resize: none;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
        }

        button {
            padding: 12px 20px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #clear-btn { background: #ff3b30; }

        #theme-toggle { padding: 10px 14px; font-size: 16px; background: #666; }

        /* Thinking animation */
        .thinking {
            background: var(--grok-bg);
            color: #888;
            font-style: italic;
            padding: 12px 16px;
            border-radius: 20px;
            max-width: 80%;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing-dots::after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        /* Code & copy button */
        .message.grok pre {
            background: var(--code-bg);
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
            position: relative;
            margin: 0.8em 0;
            font-size: 14px;
            font-family: 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
        }

        .message.grok code {
            background: var(--code-bg);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
        }

        .message.grok pre .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s, background 0.2s;
        }

        .message.grok pre .copy-btn:hover {
            opacity: 1;
            background: #005ecb;
        }
        .message.thinking {
            opacity: 1 !important;
            transform: none !important;
            transition: none !important;
        }
    </style>
</head>
<body data-theme="auto">

    <div id="chat-container" aria-live="polite" role="log"></div>

    <div id="input-container">
        <textarea id="prompt" rows="1" placeholder="Ask Grok Student anything..."></textarea>
        <button id="send-btn" type="button">Send</button>
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Theme</button>
    </div>

    <script src="marked.min.js"></script>

    <!-- Preload both highlight.js themes -->
    <link rel="stylesheet" href="github.min.css" id="hljs-light" />
    <link rel="stylesheet" href="github-dark.min.css" id="hljs-dark" />

    <script src="highlight.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
