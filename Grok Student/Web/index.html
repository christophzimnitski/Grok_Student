<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007aff" />
    <title>Grok Student</title>
    
    <!-- Branding -->
    <link rel="icon" href="/logo.png" />

    <!-- Core Styles -->
    <link rel="stylesheet" href="style.css" />

    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="katex.min.css" />

    <!-- Preload both highlight.js themes -->
    <link rel="stylesheet" href="github.min.css" id="hljs-light" />
    <link rel="stylesheet" href="github-dark.min.css" id="hljs-dark" />

    <!-- External Scripts (Deferred for performance) -->
    <script src="marked.min.js" defer></script>
    <script src="katex.min.js" defer></script>
    <script src="highlight.min.js" defer></script>

    <!-- App Script -->
    <script type="module" src="app.js" defer></script>
</head>
<body data-theme="auto">

    <main id="chat-container" aria-live="polite" role="log"></main>

    <div id="file-preview-container" class="hidden file-preview-container">
        <div class="preview-wrapper">
            <img id="preview-img" class="hidden preview-img" alt="File preview">
            <div id="preview-file" class="hidden preview-file"></div>
            <button id="remove-btn" type="button" class="remove-btn" aria-label="Remove file">✕</button>
        </div>
    </div>

    <div id="input-container">
        <button id="upload-btn" type="button">Upload</button>
        <textarea id="prompt" rows="1" placeholder="Ask Grok Student anything..."></textarea>
        <button id="send-btn" type="button">Send</button>
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Theme</button>
    </div>

    <!-- Accept any file types to support docs and code files natively -->
    <input type="file" id="file-input" accept="*/*" class="hidden">

</body>
</html>
