<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007aff" />
    <title>Grok Student</title>
    
    <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="auto">

    <div id="chat-container" aria-live="polite" role="log"></div>

    <div id="file-preview-container" style="display: none; padding: 12px 16px; background: var(--input-bg); border-top: 1px solid var(--border);">
        <div style="position: relative; display: inline-block;">
            <img id="preview-img" style="max-height: 120px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none;">
            <div id="preview-file" style="display: none; padding: 12px 16px; background: var(--code-bg); color: var(--text); border-radius: 8px; border: 1px solid var(--border); font-family: monospace; font-size: 14px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.1);"></div>
            <button id="remove-btn" type="button" style="position: absolute; top: -10px; right: -10px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; padding: 0; font-size: 12px; line-height: 1; cursor: pointer; z-index: 10;">✕</button>
        </div>
    </div>

    <div id="input-container">
        <button id="upload-btn" type="button">Upload</button>
        <textarea id="prompt" rows="1" placeholder="Ask Grok Student anything..."></textarea>
        <button id="send-btn" type="button">Send</button>
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Theme</button>
    </div>

    <!-- Accept any file types to support docs and code files natively -->
    <input type="file" id="file-input" accept="*/*" style="display: none;">

    <!-- Markdown Parser -->
    <script src="marked.min.js"></script>

    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="katex.min.css" />
    <script src="katex.min.js"></script>

    <!-- Preload both highlight.js themes -->
    <link rel="stylesheet" href="github.min.css" id="hljs-light" />
    <link rel="stylesheet" href="github-dark.min.css" id="hljs-dark" />
    <script src="highlight.min.js"></script>

    <!-- App Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
